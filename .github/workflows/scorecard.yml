name: Scorecard

# OpenSSF Scorecard: scores the repo's supply-chain practices (pinned
# dependencies, token permissions, branch protection, ...) and uploads the
# findings to code scanning. Based on ossf/scorecard-action's
# examples/scorecard.yml.
#
# Publishing to api.scorecard.dev restricts this workflow (README, "Workflow
# Restrictions"): no workflow-level env or defaults, no write permissions
# at the top, id-token only on the analysis job, and that job may only use
# checkout, upload-artifact, codeql-action/upload-sarif, scorecard-action
# and harden-runner, with no run: steps and no job-level env.
#
# Not the example's `cache-mode: none`: actionlint 1.7.12 rejects the key,
# and nothing here uses a cache.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so the Maintained and Vulnerabilities checks stay current
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      # Upload SARIF to code scanning
      security-events: write
      # Sign the results published to api.scorecard.dev
      id-token: write
    steps:
      # Network, file and process monitoring of the runner (StepSecurity)
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Fail if the API rejects the results, e.g. for breaking one of
          # the restrictions above
          fail_on_publish_error: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() }}
        with:
          sarif_file: results.sarif
