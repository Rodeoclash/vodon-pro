name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs these checks first, then publishes what `package` built
  workflow_call:
    inputs:
      release:
        description: Build without caches and upload the packages
        type: boolean
        default: false

# Each job asks for what it needs
permissions: {}

# A new push to a PR replaces its running checks; main always runs to
# completion. A fixed prefix: when called, github.workflow is the caller's.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Network, file and process monitoring of the runner (StepSecurity).
      # Egress limited to the baseline: setup, plus zizmor's online audits
      # (api.github.com, api.osv.dev) and npm audit (api.npmjs.org, npm.jsr.io).
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443
            api.github.com:443
            api.osv.dev:443
            api.npmjs.org:443
            npm.jsr.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node, Biome, gitleaks, actionlint and zizmor at the versions in
      # mise.toml, then npm ci
      - uses: ./.github/actions/setup

      - name: Secrets
        run: gitleaks git --redact --no-banner --verbose

      - name: Biome
        run: biome ci

      # Workflow syntax, expressions and shellcheck on run: blocks
      - name: actionlint
        run: actionlint

      # Workflow security; online audits also check pinned SHAs belong to
      # their repos and that no pinned action has a known advisory
      - name: zizmor
        run: zizmor --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

      # Lockfile only points at the npm registry over https with sha512,
      # registry signatures verify, and no high/critical advisories. Covers
      # devDependencies too: the renderer's libraries are bundled into the app.
      - name: Dependencies
        run: npm run audit:deps

      # Unused dependencies, exports and files; dependencies used but not
      # declared in package.json
      - name: knip
        run: npm run knip -- --reporter github-actions

      - name: Typecheck
        run: npm run typecheck

      # Fails if coverage drops below the thresholds in vitest.config.ts
      - name: Unit tests
        run: npm run test:coverage

  # What a PR adds or changes in the dependency tree: new advisories at
  # high or above, and licences outside the list
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Network, file and process monitoring of the runner (StepSecurity).
      # Egress limited to the baseline: GitHub's API and the advisory and
      # licence sources dependency-review queries.
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.securityscorecards.dev:443
            api.deps.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # The default is runtime only, but the renderer's libraries are
          # devDependencies that ship in the app
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD,
            BlueOak-1.0.0, MPL-2.0, Zlib, CC0-1.0, CC-BY-4.0, Python-2.0,
            WTFPL, Unlicense
          # GPL-3.0-or-later: ships FFmpeg's GPL build. Reviewed exception;
          # anything else copyleft needs a decision before it's added.
          allow-dependencies-licenses: pkg:npm/ffmpeg-ffprobe-static

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Network, file and process monitoring of the runner (StepSecurity).
      # Egress limited to the baseline: setup only. The app under test
      # calls Google Fonts and Chromium's component updater (*.gvt1.com),
      # which the tests don't need.
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: node

      - run: npm run build

      # Electron needs a display; Playwright drives the built app
      - name: End-to-end tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e

      # Tests that passed only on their retry: warnings and a summary
      - name: Flaky tests
        if: ${{ !cancelled() }}
        run: node e2e/report-flaky.mts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-test-results
          path: test-results
          retention-days: 7

  package:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      # Network, file and process monitoring of the runner (StepSecurity).
      # Linux blocks egress outside the baseline (setup, electron-builder's
      # downloads from GitHub releases); macOS and Windows runners support
      # audit only, and ignore the list.
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: node
          cache: ${{ !inputs.release }}

      - name: Package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update feeds (latest*.yml) match the files, block maps exist,
      # installers within their size budgets
      - name: Check release files
        run: npm run check:release

      # Launch the packaged, fused app: fuses flipped, bundled ffmpeg and
      # ffprobe run from app.asar.unpacked, app://vodon/ loads sandboxed,
      # a video plays over vodon-media://
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:smoke

      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run test:smoke

      # For release.yml's publish job: what was just checked is what ships
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: release-${{ runner.os }}
          path: |
            release/build/*.AppImage
            release/build/*.exe
            release/build/*.dmg
            release/build/*.zip
            release/build/*.blockmap
            release/build/latest*.yml
          if-no-files-found: error
          retention-days: 7
